<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.steamstatic.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co https://raw.githubusercontent.com">
  <title>RQ Tools</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="dropdown">
      <button id="brandBtn" class="brand"><span class="logo">◆</span> <span id="appTitle">RQ Tools</span></button>
      <div id="toolsMenu" class="menu tools-menu" hidden></div>
    </div>
    <span id="toolName" class="tool-name" hidden></span>
    <input id="buildName" class="build-name calc-only" spellcheck="false">
    <button id="btnSave" class="btn primary calc-only"></button>
    <div class="dropdown calc-only">
      <button id="btnBuilds" class="btn"></button>
      <div id="buildsMenu" class="menu" hidden></div>
    </div>
    <button id="btnNew" class="btn calc-only"></button>
    <button id="btnCode" class="btn calc-only"></button>
    <button id="btnPublic" class="btn public calc-only"></button>
    <div class="spacer"></div>
    <div class="lang" id="langSwitch"></div>
    <a id="btnForum" class="btn forum-btn" href="https://royalquest.net/" target="_blank" rel="noopener"><img src="forum-icon.png" alt="" draggable="false"><span></span></a>
    <button id="btnSteam" class="btn steam-btn"></button>
    <div class="dropdown">
      <button id="btnNews" class="btn icon-only news-btn"></button>
      <div id="newsMenu" class="menu news-menu" hidden></div>
    </div>
    <button id="btnBug" class="btn icon-only"></button>
    <button id="btnSettings" class="btn icon-only"></button>
  </header>
  <!-- maintenance soon / running (app/steam-calendar.js) -->
  <div id="maintBar" class="maint-bar" hidden></div>

  <main class="layout">
    <aside class="col left" id="left"></aside>
    <section class="col center">
      <nav class="tabs" id="tabs"></nav>
      <div class="tab-body" id="center"></div>
    </section>
    <aside class="col right" id="right"></aside>
  </main>

  <!-- phones: jump between the calculator's three columns -->
  <nav id="mobileNav" class="mobile-nav calc-only"></nav>

  <div id="modal" class="modal" hidden></div>
  <div id="tip" class="tip" hidden></div>

  <script src="../data/rqdata.js"></script>
  <script src="../data/bosses.js"></script>
  <script src="../data/market-items.js"></script>
  <script src="../data/base-monsters.js"></script>
  <script src="../data/base-world.js"></script>
  <script src="../data/base-icons.js"></script>
  <script src="../data/base-goods.js"></script>
  <script src="../data/base-sources.js"></script>
  <script src="../data/changelog.js"></script>
  <script src="../data/lang-uk.js"></script>
  <script src="../data/lang-en.js"></script>
  <script src="../src/engine.js"></script>
  <script src="config.js"></script>
  <script src="version.js"></script>
  <script src="i18n.js"></script>
  <script src="builds.js"></script>
  <script src="settings.js"></script>
  <script src="bosses.js"></script>
  <script src="report.js"></script>
  <script src="market.js"></script>
  <script src="base.js"></script>
  <script src="steam-news.js"></script>
  <script src="steam-calendar.js"></script>
  <script src="news.js"></script>
  <script src="app.js"></script>
</body>
</html>
