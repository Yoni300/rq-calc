<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>RQ Stats</title>
<style>
/* RQ Tools look (app/app.css, app/alert.css): warm blacks, bronze frame, gold accents.
   Event colours (damage, gold, exp, heal…) stay the game's chat colours. */
:root {
  --bg1: 34 28 20;
  --bg2: 17 14 10;
  --line: rgba(214, 168, 79, .16);
  --line-2: rgba(214, 168, 79, .32);
  --line-3: rgba(214, 168, 79, .55);
  --soft: rgba(240, 210, 150, .06);
  --fg: #eee4cf;
  --muted: #a89a80;
  --dim: #6f6553;
  --accent: #e6b85c;
  --gold-2: #c9963f;
  --gold-3: #8a6428;
  --gold-hi: #ffe2a0;
  --on-gold: #1d1407;
  --p1: #f2c771;
  --p3: #a87a2f;
  --p-border: #f5d48c;
  --dmg: #ffd20f;
  --recv: #ff5a4f;
  --heal: #3fdc76;
  --exp: #5fa9ec;
  --pick: #c9bfae;
  --gold: #f09a3e;
  --card: #c3a0ff;
  --f-display: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --f-body: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--fg); font-family: var(--f-body); font-size: 13.5px; overflow: hidden; user-select: none; }
[hidden] { display: none !important; }
.ov {
  --a: .88; position: relative; margin: 6px; overflow: hidden; border-radius: 10px;
  background: linear-gradient(180deg, rgb(var(--bg1) / var(--a)), rgb(var(--bg2) / var(--a)) 70%);
  border: 1px solid rgba(230, 184, 92, .45);
  box-shadow: inset 0 1px 0 rgba(255, 220, 150, .08), inset 0 0 0 1px rgba(0, 0, 0, .45);
  font-variant-numeric: tabular-nums;
}

/* ---------- title bar ---------- */
.head {
  position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 7px 7px 12px; cursor: move;
  background: linear-gradient(180deg, rgba(48, 38, 26, .7), rgba(20, 16, 11, .35));
  border-bottom: 1px solid var(--line-2);
}
.head::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-2) 30%, var(--gold-hi) 50%, var(--gold-2) 70%, transparent); opacity: .5; }
.brand { display: flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .03em; color: var(--accent); white-space: nowrap; text-shadow: 0 1px 0 #000, 0 0 14px rgba(230, 184, 92, .25); }
.logo { color: var(--gold-hi); font-size: 12px; transform: translateY(-1px); }
.sess { display: flex; align-items: center; gap: 7px; margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.dot.on { background: #86d46d; box-shadow: 0 0 8px rgba(134, 212, 109, .7); animation: pulse 1.6s ease-in-out infinite; }
.dot.warn { background: var(--accent); box-shadow: 0 0 8px rgba(230, 184, 92, .6); }
.dot.err { background: var(--recv); box-shadow: 0 0 8px rgba(255, 90, 79, .6); }
/* paused: the timer stands still */
.sess.paused #timer { color: var(--accent); }
.sess.paused .dot { background: var(--accent); box-shadow: none; animation: none; }
.tools { display: flex; gap: 1px; }
.ib { height: 26px; min-width: 26px; display: inline-grid; place-items: center; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
.ib:hover { background: var(--soft); color: var(--gold-hi); border-color: var(--line-2); }
.ib svg { width: 15px; height: 15px; display: block; }
.ib.on { color: var(--accent); border-color: var(--line-2); background: rgba(230, 184, 92, .1); }
.ib.paused { color: var(--accent); border-color: var(--line-3); background: rgba(230, 184, 92, .1); }
.ib.arm { padding: 0 8px; color: var(--recv); border-color: rgba(255, 90, 79, .7); background: rgba(255, 90, 79, .08); }
#bQuit:hover { color: #ff8a80; border-color: rgba(255, 90, 79, .5); background: rgba(255, 90, 79, .08); }

/* «save the session»: a name field under the title */
.saverow { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .2); }
.saverow input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, .4); color: var(--fg); outline: none; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .6); }
.saverow input:focus { border-color: var(--line-3); }
.saverow button { font: inherit; font-size: 12.5px; font-weight: 700; padding: 0 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--p-border); color: var(--on-gold); background: linear-gradient(180deg, var(--p1), var(--gold-2) 55%, var(--p3)); }
.saverow button.no { background: transparent; color: var(--muted); border-color: var(--line-2); font-weight: 400; padding: 0 9px; }
.saverow button.no:hover { color: var(--fg); }
.savedmsg { padding: 6px 12px; font-size: 12px; color: #a6e88e; background: rgba(134, 212, 109, .07); border-bottom: 1px solid var(--line); }

/* ---------- top numbers ---------- */
.hud { display: flex; margin-left: -1px; }
.tile { position: relative; flex: 1 1 0; padding: 9px 12px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-left: 1px solid var(--line); overflow: hidden; }
.lbl { position: relative; display: flex; align-items: center; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); white-space: nowrap; }
.val { position: relative; font-weight: 700; font-size: 21px; line-height: 1.15; white-space: nowrap; text-shadow: 0 1px 0 #000; }
.t-dps .val { color: var(--dmg); } .t-gold .val { color: var(--gold); } .t-exp .val { color: var(--exp); }
.sub:empty { display: none; }
.sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
/* the DPS sparkline lies under the number, along the bottom of the tile */
.t-dps { padding-bottom: 17px; }
.spark { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 16px; display: block; pointer-events: none; }
.spark .ln { fill: none; stroke: var(--dmg); stroke-width: 1.3; opacity: .75; vector-effect: non-scaling-stroke; }
.spark .ar { fill: url(#gSpark); }

.strip { display: flex; margin-left: -1px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .18); }
.strip > div { flex: 1 1 0; padding: 6px 12px 7px; display: flex; flex-direction: column; gap: 1px; min-width: 0; border-left: 1px solid var(--line); }
.strip span { display: flex; align-items: center; font-size: 11px; color: var(--muted); white-space: nowrap; }
.strip b { font-size: 15px; font-weight: 700; }

.ov.compact .body, .ov.compact .feed { display: none; }
.ov.compact .strip { border-bottom: 0; }

/* ---------- settings ---------- */
.ov.set-open > :not(.head):not(.settings):not(svg) { display: none !important; }
.settings { padding: 4px 14px 14px; }
.settings h4 { display: flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 12px 0 7px; }
.settings h4::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.opts label, .alpha { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.opts label:hover { color: var(--gold-hi); }
.opts input, .alpha input { accent-color: var(--gold-2); margin: 0; }
.alpha input { flex: 1; }
.done { margin-top: 16px; font: inherit; font-weight: 700; color: var(--on-gold); background: linear-gradient(180deg, var(--p1), var(--gold-2) 55%, var(--p3)); border: 1px solid var(--p-border); border-radius: 6px; padding: 6px 18px; cursor: pointer; text-shadow: 0 1px 0 rgba(255, 240, 200, .4); }
.done:hover { filter: brightness(1.07); box-shadow: 0 0 14px rgba(230, 184, 92, .35); }
/* language: a segmented switch like in RQ Tools */
.chips.lang { display: inline-flex; gap: 2px; padding: 2px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 6px; }
.chips.lang .chip { border: 0; border-radius: 4px; padding: 3px 11px; background: none; color: var(--dim); font-weight: 700; font-size: 12px; }
.chips.lang .chip:hover { color: var(--muted); }
.chips.lang .chip[aria-pressed="true"] { background: linear-gradient(180deg, #3a2f20, #2a2218); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line-2); text-shadow: none; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line-2); background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .22)); }
.tab { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0; margin-bottom: -1px; color: var(--muted); font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .02em; padding: 6px 4px 7px; cursor: pointer; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent); background: linear-gradient(180deg, #2a2219, rgb(var(--bg2) / .6)); border-color: var(--line-2); box-shadow: inset 0 1px 0 rgba(255, 225, 160, .1); }
.tab[aria-selected="true"]::before { content: ''; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.tab .n { font-family: var(--f-body); font-size: 10.5px; font-weight: 700; color: var(--on-gold); background: var(--gold-3); border-radius: 8px; padding: 0 6px; margin-left: 6px; line-height: 16px; }
.tab .n:empty { display: none; }
.tab[aria-selected="true"] .n { background: var(--gold-2); }
.pane { padding: 10px 10px 12px; }
.sum { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); padding: 0 4px 8px; }
.sum b { color: var(--gold-hi); }
.cols { display: grid; gap: 10px; padding: 0 8px 4px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.cols span:not(:first-child) { text-align: right; }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0 2px 0 0; max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.list::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-3), #5c4420); border-radius: 3px; }
.row { display: grid; gap: 10px; align-items: center; padding: 5px 8px 7px; border-radius: 6px; position: relative; }
.row:hover { background: var(--soft); }
.m-grid { grid-template-columns: minmax(0, 1fr) 60px; }
.l-grid { grid-template-columns: minmax(0, 1fr) 60px; }
.nm { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.nm.card { color: var(--card); }
/* mob and loot pictures (stats/icons.js gives the path inside data/) */
.nm.has-pic { display: flex; align-items: center; gap: 9px; }
.pic { flex: none; width: 24px; height: 24px; border-radius: 6px; object-fit: cover; background: radial-gradient(circle, #3a2d1a, #120f0b); border: 1px solid rgba(201, 150, 63, .55); box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); }
.pic.mob { border-radius: 50%; }
.nm.card .pic { border-color: rgba(195, 160, 255, .6); }
.ct { font-weight: 700; text-align: right; }
.share { position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; background: rgba(255, 255, 255, .04); border-radius: 1px; }
.share i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-3), var(--accent)); opacity: .8; border-radius: 1px; }
.flash { animation: flash 1.2s ease-out; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px 10px; }
.chip { display: inline-flex; align-items: center; font: inherit; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, .3); color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--fg); border-color: var(--line-3); }
.chip[aria-pressed="true"] { background: linear-gradient(180deg, var(--p1), var(--gold-2) 55%, var(--p3)); border-color: var(--p-border); color: var(--on-gold); text-shadow: 0 1px 0 rgba(255, 240, 200, .35); }
.chip .n { font-size: 11px; opacity: .75; margin-left: 4px; }
.empty { padding: 18px 12px; color: var(--dim); font-size: 12.5px; line-height: 1.45; text-align: center; }

/* ---------- combat ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 0 12px; }
.st { min-width: 0; padding: 7px 9px 8px; border: 1px solid var(--line); border-radius: 7px; background: rgba(0, 0, 0, .2); }
.st .k { display: flex; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.st .v { font-size: 16px; font-weight: 700; white-space: nowrap; margin-top: 1px; }
.st .s { font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
.st .s:empty { display: none; }
.c-dmg { color: var(--dmg); } .c-recv { color: var(--recv); } .c-heal { color: var(--heal); }
.chart { padding: 8px 9px 7px; border: 1px solid var(--line); border-radius: 7px; background: rgba(0, 0, 0, .2); }
.chart-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.chart-h b { color: var(--dmg); }
.chart svg { width: 100%; height: 80px; display: block; background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 25%; border-bottom: 1px solid var(--line-2); }
.chart svg rect { fill: url(#gBar); }
.chart-x { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 4px; }

/* ---------- last events ---------- */
.feed { border-top: 1px solid var(--line-2); padding: 8px 12px 10px; background: rgba(0, 0, 0, .25); }
.feed-h { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); margin: 0 0 5px; }
.feed ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; min-height: 84px; justify-content: flex-end; font-size: 12.5px; }
.feed li { overflow-wrap: anywhere; line-height: 1.3; }
.feed .t { font-size: 11px; color: var(--dim); margin-right: 7px; }
.e-kill, .e-level { color: var(--exp); } .e-item { color: var(--pick); } .e-gold { color: var(--gold); } .e-recv { color: var(--recv); } .e-heal { color: var(--heal); }

/* «show me the chat» and other notes under the title */
.hint { padding: 9px 12px 10px 13px; font-size: 12.5px; color: #f0c674; line-height: 1.45; background: rgba(230, 184, 92, .07); border-bottom: 1px solid var(--line); box-shadow: inset 3px 0 0 var(--accent); }
.hint button { font: 700 12.5px var(--f-body); color: var(--gold-hi); background: linear-gradient(180deg, rgba(230, 184, 92, .22), rgba(230, 184, 92, .08)); border: 1px solid var(--accent); border-radius: 6px; padding: 4px 13px; margin-top: 7px; cursor: pointer; }
.hint button:hover { background: rgba(230, 184, 92, .3); }

/* small game icons next to the labels */
.ic { width: 16px; height: 16px; object-fit: contain; margin-right: 5px; flex: none; vertical-align: -3px; }
.lbl .ic, .strip span .ic { width: 14px; height: 14px; }
.tab .ic { width: 16px; height: 16px; margin-right: 6px; }
.feed .ic { width: 14px; height: 14px; margin: 0 5px 0 0; }
.nm .ic { width: 14px; height: 14px; }
.st .k .ic { width: 13px; height: 13px; margin-right: 4px; }
.chip .ic { width: 12px; height: 15px; margin-right: 5px; }
.lang { padding: 0 0 2px; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
@keyframes flash { from { background: rgba(230, 184, 92, .22); } to { background: transparent; } }
</style>
</head>
<body>
<section class="ov" id="ov">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#b07a0c"/></linearGradient>
    <linearGradient id="gSpark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd20f" stop-opacity=".3"/><stop offset="1" stop-color="#ffd20f" stop-opacity="0"/></linearGradient>
  </defs></svg>
  <header class="head" id="head">
    <div class="brand"><span class="logo">◆</span>RQ Stats</div>
    <div class="sess"><span class="dot" id="dot"></span><span id="timer">00:00:00</span></div>
    <div class="tools">
      <button class="ib" id="bSet" data-i18n-title="settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7"/><circle cx="11" cy="4.5" r="1.6"/><circle cx="5" cy="11.5" r="1.6"/></svg></button>
      <button class="ib" id="bCal" data-i18n-title="calibrate"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3"/></svg></button>
      <button class="ib" id="bPause"></button>
      <button class="ib" id="bSave"></button>
      <button class="ib" id="bReset"></button>
      <button class="ib" id="bCompact"></button>
      <button class="ib" id="bQuit" data-i18n-title="quit"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </header>

  <form class="saverow" id="saveRow" hidden><input id="saveName" maxlength="80" autocomplete="off"><button type="submit" id="saveOk"></button><button type="button" class="no" id="saveNo">✕</button></form>
  <div class="savedmsg" id="savedMsg" hidden></div>
  <div class="hint" id="hint" hidden></div>

  <div class="settings" id="settings" hidden>
    <h4 data-i18n="language"></h4>
    <div class="chips lang" id="langs">
      <button class="chip" data-lang="uk">Українська</button>
      <button class="chip" data-lang="ru">Русский</button>
      <button class="chip" data-lang="en">English</button>
    </div>
    <h4 data-i18n="show"></h4>
    <div class="opts" id="opts"></div>
    <h4 data-i18n="alpha"></h4>
    <label class="alpha" for="alpha"><input type="range" id="alpha" min="40" max="100" step="2"></label>
    <button class="done" id="bDone" data-i18n="done"></button>
  </div>

  <div class="hud" id="hud">
    <div class="tile t-dps" data-k="dps"><span class="lbl"><img class="ic" src="icons/sword.png" alt="">DPS</span><span class="val" id="vDps">0</span>
      <svg class="spark" viewBox="0 0 100 20" preserveAspectRatio="none"><path class="ar" id="spA"></path><path class="ln" id="spL"></path></svg></div>
    <div class="tile t-gold" data-k="gold"><span class="lbl"><img class="ic" src="icons/gold.png" alt=""><span data-i18n="gold"></span></span><span class="val" id="vGold">0</span><span class="sub"></span></div>
    <div class="tile t-exp" data-k="exp"><span class="lbl"><img class="ic" src="icons/exp.png" alt=""><span data-i18n="exp"></span></span><span class="val" id="vExp">0</span><span class="sub"></span></div>
  </div>
  <div class="strip" id="strip">
    <div data-k="kills"><span><img class="ic" src="icons/kills.png" alt=""><span data-i18n="kills"></span></span><b id="vKills">0</b></div>
    <div data-k="items"><span><img class="ic" src="icons/loot.png" alt=""><span data-i18n="items"></span></span><b id="vItems">0</b></div>
    <div data-k="level"><span><img class="ic" src="icons/level.png" alt=""><span data-i18n="level"></span></span><b id="vLvl">—</b></div>
  </div>

  <div class="body" id="body">
    <nav class="tabs">
      <button class="tab" data-tab="mobs"><img class="ic" src="icons/mobs.png" alt=""><span data-i18n="tabMobs"></span><span class="n" id="nMobs"></span></button>
      <button class="tab" data-tab="loot"><img class="ic" src="icons/loot.png" alt=""><span data-i18n="tabLoot"></span><span class="n" id="nLoot"></span></button>
      <button class="tab" data-tab="combat"><img class="ic" src="icons/sword.png" alt=""><span data-i18n="tabCombat"></span></button>
    </nav>
    <div class="pane" id="p-mobs">
      <div class="sum"><span><span data-i18n="totalKilled"></span> <b id="mTotal">0</b></span><span id="mKinds"></span></div>
      <div class="cols m-grid"><span data-i18n="colMob"></span><span data-i18n="colKilled"></span></div>
      <ul class="list" id="mobList"></ul>
    </div>
    <div class="pane" id="p-loot" hidden>
      <div class="chips" id="chips"></div>
      <div class="cols l-grid"><span data-i18n="colItem"></span><span data-i18n="colQty"></span></div>
      <ul class="list" id="lootList"></ul>
    </div>
    <div class="pane" id="p-combat" hidden>
      <div class="stats">
        <div class="st"><div class="k"><img class="ic" src="icons/sword.png" alt=""><span data-i18n="dealt"></span></div><div class="v c-dmg" id="cDealt">0</div></div>
        <div class="st"><div class="k"><img class="ic" src="icons/shield.png" alt=""><span data-i18n="recv"></span></div><div class="v c-recv" id="cRecv">0</div></div>
        <div class="st"><div class="k"><img class="ic" src="icons/heal.png" alt=""><span data-i18n="heal"></span></div><div class="v c-heal" id="cHeal">0</div></div>
        <div class="st"><div class="k" data-i18n="maxHit"></div><div class="v" id="cMax">0</div><div class="s" id="cMaxOn"></div></div>
        <div class="st"><div class="k" data-i18n="avgDps"></div><div class="v" id="cAvg">0</div><div class="s" data-i18n="perSession"></div></div>
        <div class="st"><div class="k" data-i18n="peakDps"></div><div class="v" id="cPeak">0</div><div class="s" id="cAcc"></div></div>
      </div>
      <div class="chart">
        <div class="chart-h"><span data-i18n="chartTitle"></span><span><span data-i18n="max"></span> <b id="chMax">0</b></span></div>
        <svg viewBox="0 0 300 80" preserveAspectRatio="none" id="chart"></svg>
        <div class="chart-x"><span data-i18n="m2"></span><span data-i18n="m1"></span><span data-i18n="now"></span></div>
      </div>
    </div>
  </div>

  <div class="feed" data-k="feed">
    <div class="feed-h"><span id="srcScreen"></span><span id="srcFile"></span></div>
    <ol id="feed"></ol>
  </div>
</section>

<script src="i18n.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // own keys (rqs.*): the RQ Tools pages share this storage
  const store = { get(k, d) { try { return localStorage.getItem('rqs.' + k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('rqs.' + k, v); } catch {} } };
  const LOCALE = { uk: 'uk-UA', ru: 'ru-RU', en: 'en-US' };
  // the language chosen here, else the one of RQ Tools (stats/index.js passes it in the address)
  let lang = [store.get('lang', null), new URLSearchParams(location.search).get('lang'), 'uk'].find((l) => l && RQ_I18N[l]);
  let T = RQ_I18N[lang];
  let nf = new Intl.NumberFormat(LOCALE[lang]);
  const fmt = (n) => nf.format(Math.round(n || 0));
  const big = (n) => n >= 1e6 ? nf.format(Math.round(n / 1e4) / 100) + T.million : fmt(n);
  const pad = (n) => String(n).padStart(2, '0');
  const hms = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ICON = {
    reset: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg>',
    up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>',
    down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>',
    pause: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg>',
    play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.2v9.6L12.6 8z"/></svg>',
    save: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 2.5h8l2.5 2.5v8.5h-11z"/><path d="M5.5 2.5v3h5v-3M5 13.5V9.5h6v4"/></svg>',
  };

  const img = (n) => '<img class="ic" src="icons/' + n + '.png" alt="">';
  const ICON_IMG = { card: img('card') };
  // a mob / item picture from data/ (RQ Tools); hidden if the file is missing
  const pic = (p, mob) => p ? '<img class="pic' + (mob ? ' mob' : '') + '" src="../../data/' + esc(p) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '';
  const FEED_IMG = { kill: img('kills'), item: img('loot'), gold: img('gold'), level: img('level'), heal: img('heal'), recv: img('shield') };

  let S = null;
  let tab = store.get('tab', 'mobs');
  let cat = 'all';
  const ov = $('ov');

  // ----- click-through except over the panel; drag by the header -----
  let dragging = false;
  ov.addEventListener('mouseenter', () => window.rq.interactive(true));
  ov.addEventListener('mouseleave', () => { if (!dragging) window.rq.interactive(false); });
  $('head').addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    dragging = true;
    const sx = e.screenX, sy = e.screenY;
    $('head').setPointerCapture(e.pointerId);
    window.rq.dragStart();
    const move = (ev) => window.rq.drag(ev.screenX - sx, ev.screenY - sy);
    const up = () => {
      dragging = false;
      $('head').removeEventListener('pointermove', move);
      window.rq.dragEnd();
    };
    $('head').addEventListener('pointermove', move);
    $('head').addEventListener('pointerup', up, { once: true });
  });

  // ----- buttons -----
  $('bCal').onclick = () => window.rq.action('calibrate');
  // pause: nothing counts and the timer stands until «continue»
  $('bPause').onclick = () => window.rq.action('pause');
  // save: name the session (a date by default), Enter saves, Esc cancels; the session itself goes on
  const sessName = () => { const d = new Date(); return T.sessDefault + ' ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const closeSave = () => { $('saveRow').hidden = true; window.rq.interactive(false); };
  $('bSave').onclick = () => {
    const row = $('saveRow');
    if (!row.hidden) { closeSave(); return; }
    row.hidden = false; $('saveName').value = sessName(); $('saveName').focus(); $('saveName').select();
  };
  $('saveRow').onsubmit = (e) => {
    e.preventDefault();
    window.rq.save($('saveName').value.trim() || sessName());
    closeSave();
    const m = $('savedMsg'); m.textContent = T.saved; m.hidden = false; setTimeout(() => { m.hidden = true; }, 2500);
  };
  $('saveNo').onclick = closeSave;
  $('saveName').addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSave(); });
  $('bQuit').onclick = () => window.rq.action('quit');
  let armT = null;
  const resetBtn = $('bReset');
  const disarm = () => { resetBtn.classList.remove('arm'); resetBtn.innerHTML = ICON.reset; resetBtn.title = T.reset; };
  resetBtn.onclick = () => {
    if (!resetBtn.classList.contains('arm')) {
      resetBtn.classList.add('arm'); resetBtn.textContent = T.resetAsk;
      clearTimeout(armT); armT = setTimeout(disarm, 3000);
      return;
    }
    clearTimeout(armT); disarm();
    window.rq.action('reset');
  };
  const setCompact = (on) => {
    ov.classList.toggle('compact', on);
    $('bCompact').innerHTML = on ? ICON.down : ICON.up;
    $('bCompact').title = on ? T.expand : T.compact;
    store.set('compact', on ? '1' : '0');
  };
  $('bCompact').onclick = () => setCompact(!ov.classList.contains('compact'));
  document.querySelectorAll('.tab').forEach((b) => b.onclick = () => setTab(b.dataset.tab));
  $('chips').onclick = (e) => { const b = e.target.closest('.chip'); if (b) { cat = b.dataset.cat; render(); } };

  // ----- settings: language, show / hide each part, opacity -----
  const OPTS = [['dps', 'DPS'], ['gold', 'gold'], ['exp', 'exp'], ['kills', 'kills'], ['items', 'items'], ['level', 'level'],
    ['mobs', 'optMobs'], ['loot', 'optLoot'], ['combat', 'optCombat'], ['feed', 'optFeed']];
  let hiddenSet;
  try { hiddenSet = new Set(JSON.parse(store.get('hidden', '[]'))); } catch { hiddenSet = new Set(); }
  function renderOpts() {
    $('opts').innerHTML = OPTS.map(([k, label]) =>
      '<label for="opt-' + k + '"><input type="checkbox" id="opt-' + k + '" data-opt="' + k + '"' + (hiddenSet.has(k) ? '' : ' checked') + '>' + esc(T[label] || label) + '</label>').join('');
  }
  $('opts').addEventListener('change', (e) => {
    const k = e.target.dataset.opt;
    if (!k) return;
    if (e.target.checked) hiddenSet.delete(k); else hiddenSet.add(k);
    store.set('hidden', JSON.stringify([...hiddenSet]));
    applyVisibility();
  });
  $('langs').addEventListener('click', (e) => { const b = e.target.closest('[data-lang]'); if (b) { store.set('lang', b.dataset.lang); setLang(b.dataset.lang); } });
  const alpha = Number(store.get('alpha', '88'));
  $('alpha').value = alpha;
  ov.style.setProperty('--a', alpha / 100);
  $('alpha').addEventListener('input', (e) => { ov.style.setProperty('--a', e.target.value / 100); store.set('alpha', e.target.value); });
  const openSettings = (on) => { ov.classList.toggle('set-open', on); $('settings').hidden = !on; $('bSet').classList.toggle('on', on); };
  $('bSet').onclick = () => openSettings(!ov.classList.contains('set-open'));
  $('bDone').onclick = () => openSettings(false);

  function setLang(l) {
    if (!RQ_I18N[l]) return;
    lang = l; T = RQ_I18N[l]; nf = new Intl.NumberFormat(LOCALE[l]);
    // remembered only when chosen here (the chip click); otherwise the overlay follows RQ Tools
    document.documentElement.lang = l;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T[el.dataset.i18n] ?? ''; });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = T[el.dataset.i18nTitle] ?? ''; });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    $('hint').dataset.html = '';
    renderOpts();
    disarm();
    setCompact(ov.classList.contains('compact'));
    render();
  }

  function applyVisibility() {
    document.querySelectorAll('[data-k]').forEach((el) => { el.hidden = hiddenSet.has(el.dataset.k); });
    document.querySelectorAll('.tab').forEach((b) => { b.hidden = hiddenSet.has(b.dataset.tab); });
    $('hud').hidden = ['dps', 'gold', 'exp'].every((k) => hiddenSet.has(k));
    $('strip').hidden = ['kills', 'items', 'level'].every((k) => hiddenSet.has(k));
    const tabs = ['mobs', 'loot', 'combat'].filter((k) => !hiddenSet.has(k));
    $('body').hidden = tabs.length === 0;
    if (tabs.length && !tabs.includes(tab)) setTab(tabs[0]);
  }

  function setTab(t) {
    tab = ['mobs', 'loot', 'combat'].includes(t) ? t : 'mobs';
    store.set('tab', tab);
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    for (const k of ['mobs', 'loot', 'combat']) $('p-' + k).hidden = k !== tab;
    render();
  }

  function keepScroll(el, html) { const top = el.scrollTop; el.innerHTML = html; el.scrollTop = top; }
  function kinds(n) {
    const [one, few, many] = T.kinds;
    if (lang === 'en') return n === 1 ? one : many;
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
    return many;
  }

  function renderSpark(chart) {
    const s = chart.slice(-30);
    const mx = Math.max(...s, 1);
    const pts = s.map((v, i) => [(i / (s.length - 1)) * 100, 19 - (v / mx) * 17]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
    $('spL').setAttribute('d', d);
    $('spA').setAttribute('d', d + ' L100 20 L0 20 Z');
  }

  function renderStatus(st) {
    const dot = $('dot');
    dot.className = 'dot';
    let hint = '';
    if (st.screen === 'no-region') { dot.classList.add('warn'); hint = esc(T.hintRegion.replace('{tab}', st.tab)) + '<br><button id="hintCal">' + esc(T.hintBtn) + '</button>'; }
    else if (st.screen === 'error') { dot.classList.add('err'); hint = esc(st.error === 'no-ru-ocr' ? T.noOcr : T.restarting); }
    else if (st.reading) dot.classList.add('on');
    const h = $('hint');
    h.hidden = !hint;
    if (hint && h.dataset.html !== hint) { h.innerHTML = hint; h.dataset.html = hint; const b = $('hintCal'); if (b) b.onclick = () => window.rq.action('calibrate'); }
    $('srcScreen').textContent = st.screen === 'ok' ? (st.reading ? T.scrReading : T.scrIdle) : st.screen === 'no-region' ? T.scrNoRegion : T.scrWait;
    $('srcFile').textContent = !st.chatlogsFound ? T.fileNoGame : st.exactUntil ? T.fileUntil + hms(st.exactUntil) : T.fileWait;
  }

  function render() {
    if (!S) return;
    const s = S;
    const sec = Math.floor(s.durationMs / 1000);
    $('timer').textContent = pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor(sec / 60) % 60) + ':' + pad(sec % 60);
    // paused: the timer and the counting stand still
    document.querySelector('.sess').classList.toggle('paused', !!s.paused);
    const pb = $('bPause');
    if (pb.dataset.p !== String(!!s.paused)) { pb.dataset.p = String(!!s.paused); pb.innerHTML = s.paused ? ICON.play : ICON.pause; pb.classList.toggle('paused', !!s.paused); }
    pb.title = s.paused ? T.resume : T.pause;
    if (!$('bSave').innerHTML) $('bSave').innerHTML = ICON.save;
    $('bSave').title = T.saveSess; $('saveOk').textContent = T.saveOk; $('saveName').placeholder = T.saveName;
    $('vDps').textContent = fmt(s.dps);
    renderSpark(s.chart);
    $('vGold').textContent = fmt(s.gold);
    $('vExp').textContent = big(s.exp);
    $('vKills').textContent = fmt(s.totalKills);
    $('vItems').textContent = fmt(s.totalItems);
    $('vLvl').textContent = s.level ? s.level + (s.levelsGained ? ' (+' + s.levelsGained + ')' : '') : '—';
    $('nMobs').textContent = s.mobs.length || '';
    $('nLoot').textContent = s.items.length || '';
    renderStatus(s.status);

    if (tab === 'mobs') {
      const top = s.mobs.length ? s.mobs[0].count : 1;
      $('mTotal').textContent = fmt(s.totalKills);
      $('mKinds').textContent = s.mobs.length + ' ' + kinds(s.mobs.length);
      keepScroll($('mobList'), s.mobs.length ? s.mobs.map((m) =>
        '<li class="row m-grid"><span class="nm' + (m.icon ? ' has-pic' : '') + '">' + pic(m.icon, true) + '<span>' + esc(m.name) + '</span></span><span class="ct">' + fmt(m.count) + '</span>' +
        '<span class="share"><i style="width:' + (m.count / top * 100).toFixed(1) + '%"></i></span></li>').join('')
        : '<li class="empty">' + esc(T.noKills) + '</li>');
    }
    if (tab === 'loot') {
      const cards = s.items.filter((i) => i.card);
      const chips = [['all', T.all, s.items.length], ['card', ICON_IMG.card + T.cards, cards.length], ['other', T.other, s.items.length - cards.length]];
      $('chips').innerHTML = chips.map(([k, label, n]) => '<button class="chip" data-cat="' + k + '" aria-pressed="' + (cat === k) + '">' + (label.startsWith('<img') ? label : esc(label)) + '<span class="n">' + n + '</span></button>').join('');
      const rows = s.items.filter((i) => cat === 'all' || (cat === 'card') === i.card);
      keepScroll($('lootList'), rows.length ? rows.map((i) =>
        '<li class="row l-grid' + (s.now - i.last < 1500 ? ' flash' : '') + '"><span class="nm' + (i.card ? ' card' : '') + (i.icon ? ' has-pic' : '') + '"' + (i.rarity && !i.card ? ' style="color:' + i.rarity + '"' : '') + '>' + (i.icon ? pic(i.icon) : i.card ? ICON_IMG.card : '') + '<span>' + esc(i.name) + '</span></span>' +
        '<span class="ct">×' + fmt(i.qty) + '</span></li>').join('')
        : '<li class="empty">' + esc(T.noLoot) + '</li>');
    }
    if (tab === 'combat') {
      $('cDealt').textContent = big(s.dealt);
      $('cRecv').textContent = big(s.recv);
      $('cHeal').textContent = big(s.heal);
      $('cMax').textContent = fmt(s.maxHit.amount);
      $('cMaxOn').textContent = s.maxHit.target ? T.on + s.maxHit.target : '';
      $('cAvg').textContent = fmt(s.avgDps);
      $('cPeak').textContent = fmt(s.peakDps);
      const tries = s.hits + s.misses;
      $('cAcc').textContent = tries ? T.accuracy + ' ' + Math.round(s.hits / tries * 100) + '%' : '';
      const mx = Math.max(...s.chart, 1);
      $('chMax').textContent = fmt(mx);
      $('chart').innerHTML = s.chart.map((v, i) => { const bh = (v / mx) * 76; return '<rect x="' + (i * 5 + .7) + '" y="' + (80 - bh).toFixed(2) + '" width="3.6" height="' + bh.toFixed(2) + '"></rect>'; }).join('');
    }
    $('feed').innerHTML = s.feed.map((f) => '<li class="e-' + f.type + '"><span class="t">' + hms(f.time) + '</span>' + (FEED_IMG[f.type] || '') + esc(f.text) + '</li>').join('');
  }

  window.rq.onSnapshot((s) => { S = s; render(); });
  setCompact(store.get('compact', '0') === '1');
  setLang(lang);
  setTab(tab);
  applyVisibility();
})();
</script>
</body>
</html>
