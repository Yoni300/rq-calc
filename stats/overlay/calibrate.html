<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Виділіть чат</title>
<style>
/* RQ Tools look: warm blacks, bronze frame, gold accents (same as the overlay) */
html, body { margin: 0; height: 100%; background: rgba(8, 6, 4, .35); cursor: crosshair; font-family: "Segoe UI", system-ui, sans-serif; color: #eee4cf; user-select: none; overflow: hidden; }
.help { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, rgb(34 28 20 / .97), rgb(17 14 10 / .97)); border: 1px solid rgba(230, 184, 92, .55); border-radius: 10px; padding: 14px 18px; max-width: 560px; font-size: 14px; line-height: 1.5; cursor: default; box-shadow: inset 0 1px 0 rgba(255, 220, 150, .08), 0 10px 30px rgba(0, 0, 0, .5); }
.help b { color: #e6b85c; }
.help .keys { color: #a89a80; font-size: 13px; margin-top: 6px; }
.box { position: fixed; border: 2px solid #e6b85c; background: rgba(230, 184, 92, .08); box-shadow: 0 0 0 9999px rgba(0, 0, 0, .25), 0 0 14px rgba(230, 184, 92, .35); }
.box[hidden] { display: none; }
.bar { position: fixed; display: flex; gap: 8px; cursor: default; }
.bar[hidden] { display: none; }
.bar button { font: inherit; font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: 6px; border: 1px solid rgba(214, 168, 79, .32); background: linear-gradient(180deg, #2c2419, #1d1811); color: #eee4cf; cursor: pointer; }
.bar button:hover { border-color: rgba(214, 168, 79, .55); }
.bar button.ok { background: linear-gradient(180deg, #f2c771, #c9963f 55%, #a87a2f); color: #1d1407; border-color: #f5d48c; font-weight: 700; }
</style>
</head>
<body>
<div class="help" id="help">
  <span id="calHelp"></span>
  <div class="keys" id="calKeys"></div>
</div>
<div class="box" id="box" hidden></div>
<div class="bar" id="bar" hidden><button class="ok" id="ok"></button><button id="cancel"></button></div>
<script src="i18n.js"></script>
<script>
(() => {
  let lang = 'uk';
  try { lang = localStorage.getItem('rqs.lang') || new URLSearchParams(location.search).get('lang') || 'uk'; } catch {}
  const T = RQ_I18N[lang] || RQ_I18N.uk;
  document.documentElement.lang = lang;
  document.title = T.calibrate;
  document.getElementById('calHelp').innerHTML = T.calHelp;
  document.getElementById('calKeys').textContent = T.calKeys;
  document.getElementById('ok').textContent = T.calSave;
  document.getElementById('cancel').textContent = T.calCancel;
  const box = document.getElementById('box');
  const bar = document.getElementById('bar');
  let rect = null, start = null;

  function show() {
    if (!rect) { box.hidden = true; bar.hidden = true; return; }
    Object.assign(box.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
    box.hidden = false;
    bar.hidden = rect.w < 20 || rect.h < 20;
    const below = rect.y + rect.h + 44 < window.innerHeight;
    Object.assign(bar.style, { left: rect.x + 'px', top: (below ? rect.y + rect.h + 8 : Math.max(8, rect.y - 40)) + 'px' });
  }
  const save = () => { if (rect && rect.w >= 20 && rect.h >= 20) window.rq.calibDone({ x: Math.round(rect.x), y: Math.round(rect.y), w: Math.round(rect.w), h: Math.round(rect.h) }); };

  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('.bar, .help')) return;
    start = { x: e.clientX, y: e.clientY };
    rect = { x: start.x, y: start.y, w: 0, h: 0 };
    document.body.setPointerCapture(e.pointerId);
    show();
  });
  document.addEventListener('pointermove', (e) => {
    if (!start) return;
    rect = { x: Math.min(start.x, e.clientX), y: Math.min(start.y, e.clientY), w: Math.abs(e.clientX - start.x), h: Math.abs(e.clientY - start.y) };
    show();
  });
  document.addEventListener('pointerup', () => { start = null; show(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.rq.calibCancel();
    if (e.key === 'Enter') save();
  });
  document.getElementById('ok').onclick = save;
  document.getElementById('cancel').onclick = () => window.rq.calibCancel();
  window.rq.onCalibInit((d) => { if (d && d.current) { rect = d.current; show(); } });
})();
</script>
</body>
</html>
