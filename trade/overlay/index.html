<title>Обмен</title>
<style>
/* RQ Tools look (same as the stats overlay): warm blacks, bronze frame, gold accents */
:root {
  --bg1: 34 28 20; --bg2: 17 14 10;
  --line: rgba(214, 168, 79, .16); --line-2: rgba(214, 168, 79, .32); --line-3: rgba(214, 168, 79, .55);
  --soft: rgba(240, 210, 150, .06);
  --fg: #eee4cf; --muted: #a89a80; --dim: #6f6553;
  --accent: #e6b85c; --gold-2: #c9963f; --gold-hi: #ffe2a0; --on-gold: #1d1407;
  --p1: #f2c771; --p3: #a87a2f; --p-border: #f5d48c;
  --good: #86d46d; --bad: #ff6a5f; --warn: #e6b85c; --card: #c3a0ff; --coin: #f4c430;
  --f-display: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --f-body: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; color: var(--fg); font-family: var(--f-body); font-size: 13px; overflow: hidden; user-select: none; }
[hidden] { display: none !important; }
.ov { position: absolute; inset: 6px; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px;
  background: linear-gradient(180deg, rgb(var(--bg1) / .93), rgb(var(--bg2) / .93) 70%);
  border: 1px solid rgba(230, 184, 92, .45); box-shadow: inset 0 1px 0 rgba(255, 220, 150, .08), inset 0 0 0 1px rgba(0, 0, 0, .45);
  font-variant-numeric: tabular-nums; }
.head { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 11px; cursor: move; flex: none;
  background: linear-gradient(180deg, rgba(48, 38, 26, .7), rgba(20, 16, 11, .35)); border-bottom: 1px solid var(--line-2); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--accent); text-shadow: 0 1px 0 #000; white-space: nowrap; }
.grip { color: var(--dim); font-size: 13px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.on { background: var(--good); box-shadow: 0 0 8px rgba(134, 212, 109, .7); }
.dot.warn { background: var(--warn); }
.dot.err { background: var(--bad); }
.stat { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ib { height: 24px; min-width: 24px; display: inline-grid; place-items: center; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; font-size: 14px; flex: none; }
.ib:hover { background: var(--soft); color: var(--gold-hi); border-color: var(--line-2); }
.body { flex: 1; overflow-y: auto; padding: 4px 0 6px; }
.body::-webkit-scrollbar { width: 6px; } .body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
.msg { padding: 22px 16px; text-align: center; color: var(--muted); line-height: 1.45; }
.msg b { display: block; color: var(--fg); font-size: 14px; margin-bottom: 4px; font-weight: 600; }
.side { padding: 4px 10px 6px; }
.side + .side { border-top: 1px solid var(--line); }
.sh { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 3px; }
.sh h3 { margin: 0; font-family: var(--f-display); font-size: 13.5px; color: var(--accent); font-weight: 700; }
.sh small { color: var(--dim); font-size: 11px; }
.sh .sum { margin-left: auto; font-weight: 700; font-size: 14px; color: var(--gold-hi); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.row:hover { background: var(--soft); border-color: var(--line); }
.row.open { background: rgba(230, 184, 92, .08); border-color: var(--line-2); }
.nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm .q { color: var(--muted); }
.nm .tag { display: inline-block; font-size: 10px; padding: 0 4px; margin-right: 4px; border-radius: 3px; vertical-align: 1px; border: 1px solid var(--line-2); color: var(--muted); }
.nm .tag.card { color: var(--card); border-color: rgba(195, 160, 255, .45); }
.nm .tag.unique { color: var(--gold-hi); border-color: var(--line-3); }
.val { text-align: right; font-weight: 600; white-space: nowrap; }
.sub { grid-column: 1 / -1; font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.bad .val, .row.bad .sub { color: var(--bad); }
.row.bad .sub { white-space: normal; }
.row.warn .sub { color: var(--warn); }
.gold { display: flex; justify-content: space-between; padding: 3px 6px; color: var(--muted); }
.gold span:last-child { color: var(--coin); font-weight: 600; }
.foot { flex: none; border-top: 1px solid var(--line-2); padding: 8px 12px 9px; display: flex; align-items: baseline; gap: 8px; background: rgba(0, 0, 0, .22); }
.foot .lbl { color: var(--muted); }
.foot .diff { margin-left: auto; font-size: 20px; font-weight: 700; font-family: var(--f-display); }
.diff.pos { color: var(--good); } .diff.neg { color: var(--bad); } .diff.na { color: var(--dim); font-size: 14px; font-family: var(--f-body); font-weight: 400; }
.foot .note { display: block; font-size: 11px; color: var(--dim); }
/* editor under a row */
.ed { margin: 2px 0 6px; padding: 8px; border: 1px solid var(--line-2); border-radius: 8px; background: rgba(0, 0, 0, .3); display: grid; gap: 6px; }
.ed .read { font-size: 11.5px; color: var(--muted); }
.ed label { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.ed input, .ed select { width: 100%; min-width: 0; font: inherit; font-size: 12.5px; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, .45); color: var(--fg); outline: none; }
.ed input:focus, .ed select:focus { border-color: var(--line-3); }
.ed .btns { display: flex; gap: 6px; justify-content: flex-end; }
.btn { font: inherit; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 6px; cursor: pointer; border: 1px solid var(--p-border); color: var(--on-gold); background: linear-gradient(180deg, var(--p1), var(--gold-2) 55%, var(--p3)); }
.btn.no { background: transparent; color: var(--muted); border-color: var(--line-2); font-weight: 400; }
.hits { display: grid; gap: 2px; max-height: 150px; overflow-y: auto; }
.hits button { text-align: left; font: inherit; font-size: 12px; padding: 3px 6px; border-radius: 5px; border: 1px solid transparent; background: transparent; color: var(--fg); cursor: pointer; }
.hits button:hover { background: var(--soft); border-color: var(--line-2); }
.hits button small { color: var(--dim); margin-left: 4px; }
.signs { padding: 8px 12px; border-bottom: 1px solid var(--line); background: rgba(230, 184, 92, .06); display: grid; gap: 6px; }
.signs p { margin: 0; color: var(--muted); font-size: 12px; }
.signs .two { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
.out { margin: 6px 10px 2px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, .3); font-size: 12.5px; line-height: 1.4; }
.out b { font-size: 14px; }
.out.buy b { color: var(--bad); } .out.sell b { color: var(--good); }
.out.no { color: var(--warn); border-color: rgba(230, 184, 92, .35); }
.out small { display: block; color: var(--muted); font-size: 11.5px; }
.bag { display: flex; justify-content: space-between; gap: 8px; margin: 2px 10px 0; padding: 4px 6px; font-size: 12px; color: var(--muted); }
.bag span:last-child { color: var(--coin); font-weight: 600; }
.bag.miss { color: var(--warn); }
.signs input { min-width: 0; font: inherit; font-size: 12.5px; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, .45); color: var(--fg); outline: none; }
</style>
</head>

let S = null, T = L.ru, open = null; // open: 'L2' / 'R0' — the row whose editor is shown
const $ = id => document.getElementById(id);
const fmt = n => n == null ? '—' : Number(n).toLocaleString('ru-RU');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null) continue; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : String(k));

}

// drag by the title bar
$('head').addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('button')) return;
  const sx = e.screenX, sy = e.screenY; window.trade.dragStart();
  const mv = ev => window.trade.drag(ev.screenX - sx, ev.screenY - sy);
  const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); window.trade.dragEnd(); };
  addEventListener('mousemove', mv); addEventListener('mouseup', up);
});
$('bHide').onclick = () => window.trade.hide();

window.trade.onPanel(s => { S = s; T = L[s.lang] || L.ru; draw(); });

function editing() { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'SELECT') && a.closest('.ed, .signs'); }
function draw() {
  if (!S) return;
  // keep what the player is typing: a new frame redraws only when no field has the focus
  if (editing()) { drawHead(); return; }
  drawHead(); drawSigns();
  const body = $('body'), foot = $('foot');
  body.innerHTML = ''; foot.hidden = true;
  const last = S.last;
  if (!S.ready && !S.error) { body.append(el('div', { class: 'msg' }, el('b', null, T.starting))); return; }
  if (S.error && !S.ready) { body.append(el('div', { class: 'msg' }, el('b', null, 'Ошибка'), S.error)); return; }
  if (!S.game) { body.append(el('div', { class: 'msg' }, el('b', null, T.noGame), T.noGameHint)); return; }
  const ob = outcomeBox();
  if (!last || !last.observation || !last.value) {
    if (ob) { body.append(ob); return; }
    body.append(el('div', { class: 'msg' }, el('b', null, S.issue ? T[S.issue] || S.issue : T.waiting), S.issue ? '' : T.waitingHint));
    return;
  }
  const v = last.value;
  if (ob) body.append(ob);
  const bg = S.backpackGold;
  body.append(el('div', { class: 'bag' + (bg == null ? ' miss' : '') }, bg == null ? el('span', null, T.bagMiss) : [el('span', null, T.bag), el('span', null, fmt(bg))]));

// what the history did with the last trade, for 20 seconds
function outcomeBox() {
  const o = S.outcome;
  if (!o || Date.now() - o.at > 20000) return null;
  if (o.code === 'purchase' || o.code === 'sale')
    return el('div', { class: 'out ' + (o.code === 'purchase' ? 'buy' : 'sell') }, T.counted[o.code] + ' ', el('b', null, (o.code === 'purchase' ? '−' : '+') + fmt(o.amount)),
      o.reconciliation === 'mismatch' ? el('small', null, T.mismatch) : null);
  const why = String(o.code).split(':')[1];
  return el('div', { class: 'out no' }, T.notCounted, el('small', null, T.why[why] || why));
}
function drawHead() {
  $('title').textContent = T.title; document.title = T.title;
  $('bHide').title = fill(T.hide, { key: S.hotkey || 'Alt+Shift+T' });
  const st = S.last && S.last.observation ? S.last.state : null;
  const dot = $('dot');
  dot.className = 'dot ' + (S.error && !S.ready ? 'err' : !S.game ? '' : st === 'complete' ? 'on' : st ? 'warn' : 'on');
  $('stat').textContent = !S.game ? '' : st === 'complete' ? T.ok : st === 'partial' ? T.partial : st === 'suspended' ? T.suspended : st ? T.reading : '';
}
function drawSigns() {
  const box = $('signs');
  if (S.signs.buySign && S.signs.sellSign) { box.hidden = true; return; }
  if (editing()) return;
  box.hidden = false; box.innerHTML = '';
  const b = el('input', { type: 'number', min: 1, placeholder: T.buySign, value: S.signs.buySign ?? '' }), s = el('input', { type: 'number', min: 1, placeholder: T.sellSign, value: S.signs.sellSign ?? '' });
  for (const i of [b, s]) i.addEventListener('mousedown', () => window.trade.focus());
  box.append(el('p', null, T.signsAsk), el('div', { class: 'two' }, b, s, el('button', { class: 'btn', onclick: () => window.trade.signs({ buySign: b.value, sellSign: s.value }) }, T.save)));
}
function side(key, title, note, sv) {
  const box = el('div', { class: 'side' }, el('div', { class: 'sh' }, el('h3', null, title), el('small', null, note), el('span', { class: 'sum' }, sv.complete ? fmt(sv.subtotal) : fmt(sv.subtotal) + '+')));
  for (const r of sv.rows) {
    const id = key + r.index, bad = !!r.issue;
    const tag = r.category ? el('span', { class: 'tag ' + r.category }, T.cat[r.category]) : null;
    const name = r.name || fill(T.row, { n: r.index + 1 });
    const q = r.category === 'regular' && r.quantity > 1 ? el('span', { class: 'q' }, ' ×' + fmt(r.quantity)) : null;
    const sub = bad ? T.issue[r.issue] || r.issue : r.formula + (r.fuzzy ? ' · ≈' : '');
    const row = el('div', { class: 'row' + (bad ? (r.issue === 'notInCatalog' || /^no(Buy|Sell)$/.test(r.issue) ? ' warn' : ' bad') : '') + (open === id ? ' open' : ''), onclick: () => { open = open === id ? null : id; draw(); } },
      el('div', { class: 'nm', title: r.read || '' }, tag, name, q), el('div', { class: 'val' }, bad ? '—' : fmt(r.value)), el('div', { class: 'sub' }, sub));
    box.append(row);
    if (open === id) box.append(editor(r, key === 'L'));
  }
  box.append(el('div', { class: 'gold' }, el('span', null, T.gold), el('span', null, sv.gold == null ? '—' : fmt(sv.gold))));
  return box;
}
function editor(r, receiving) {
  const box = el('div', { class: 'ed', onmousedown: () => window.trade.focus() });
  if (r.read) box.append(el('div', { class: 'read' }, fill(r.fuzzy ? T.fuzzy : T.read, { t: r.read })));
  if (r.itemId) {
    // a known item: its kind and prices
    const cat = el('select', null, ['regular', 'card', 'unique'].map(c => { const o = el('option', { value: c }, T.catLong[c]); if (c === r.category) o.selected = true; return o; }));
    const buy = el('input', { type: 'number', min: 1, value: r.category !== 'card' && receiving ? r.price ?? '' : '' });
    const sell = el('input', { type: 'number', min: 1, value: r.category !== 'card' && !receiving ? r.price ?? '' : '' });
    const signs = el('input', { type: 'number', min: 1, value: r.signs ?? '' });
    const lb = el('label', null, T.buy, buy), ls = el('label', null, T.sell, sell), lg = el('label', null, T.signsN, signs);
    const sync = () => { const card = cat.value === 'card'; lb.hidden = ls.hidden = card; lg.hidden = !card; };
    cat.onchange = sync; sync();
    // the price on the other side is not in the row: ask the main side for it so it is not wiped
    window.trade.known(r.name).then(list => { const k = list.find(x => x.name === r.name); if (k && k.price) { if (k.price.buy != null) buy.value = k.price.buy; if (k.price.sell != null) sell.value = k.price.sell; } });
    box.append(el('label', null, T.category, cat), lb, ls, lg, el('div', { class: 'btns' },
      el('button', { class: 'btn no', onclick: () => { open = null; draw(); } }, T.cancel),
      el('button', { class: 'btn', onclick: () => { window.trade.price({ name: r.name, category: cat.value, buy: buy.value, sell: sell.value, signs: signs.value }); open = null; document.activeElement.blur(); draw(); } }, T.save)));
    setTimeout(() => (cat.value === 'card' ? signs : receiving ? buy : sell).focus(), 0);
  }
  // not resolved (or to correct it): tie the reading to the right item
  if (r.read) {
    const q = el('input', { type: 'text', placeholder: T.linkHint, value: r.itemId ? '' : r.read });
    const hits = el('div', { class: 'hits' });
    const search = async () => {
      const list = await window.trade.known(q.value);
      hits.innerHTML = '';
      for (const k of list) hits.append(el('button', { onclick: () => { window.trade.link(r.read, k.name); open = null; document.activeElement.blur(); draw(); } }, k.name, el('small', null, T.cat[k.category] + (k.signs ? ` · ${k.signs} ${T.signsWord}` : ''))));
      if (!list.length) hits.append(el('div', { class: 'read' }, T.none));
      if (!r.itemId && q.value.trim()) hits.append(el('button', { onclick: () => { window.trade.price({ name: q.value.trim(), category: 'regular' }); if (q.value.trim() !== r.read) window.trade.link(r.read, q.value.trim()); open = null; document.activeElement.blur(); draw(); } }, fill(T.addNew, { t: q.value.trim() })));
    };
    let tm = null; q.oninput = () => { clearTimeout(tm); tm = setTimeout(search, 150); };
    box.append(el('label', null, T.link, q), hits);
    if (!r.itemId) { search(); setTimeout(() => q.focus(), 0); }
  }
  return box;
}
