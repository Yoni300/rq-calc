# Is the game up? Players online from Steam + the game's maintenance switch → server-status.json on the `server-status`
# branch (the site reads it from raw.githubusercontent.com; neither source can be fetched from a web page). Every 5 minutes
# (GitHub often starts scheduled runs late), or by hand. The branch keeps one commit (force-pushed), so the repository
# doesn't grow; the file itself keeps the last 48 hours.
name: Server status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
          path: main
      - name: Take the last file
        run: |
          # git, not raw.githubusercontent.com: that one may serve a copy a few minutes old and lose points
          git clone -q --depth 1 -b server-status "https://github.com/${{ github.repository }}.git" old || echo "no branch yet"
          mkdir st
          if [ -f old/server-status.json ]; then cp old/server-status.json st/; fi
      - name: Ask Steam and the game
        run: node main/tools/update-server-status.mjs st/server-status.json
      - name: Publish
        working-directory: st
        run: |
          git init -q -b fresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Server status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fresh:server-status
